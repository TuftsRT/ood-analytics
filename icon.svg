<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Usage Statistics</title>
  <rect width="512" height="512" rx="104" fill="#123a59"/>
  <!-- Baseline and weekly bars, in the dashboard's palette -->
  <rect x="96" y="404" width="320" height="12" rx="6" fill="#9db8ce" opacity="0.55"/>
  <rect x="112" y="288" width="64" height="108" rx="12" fill="#5cc29d"/>
  <rect x="224" y="232" width="64" height="164" rx="12" fill="#6aa9d6"/>
  <rect x="336" y="176" width="64" height="220" rx="12" fill="#ae8bd2"/>
  <!-- Trend line over the bars -->
  <polyline points="112,232 200,176 272,200 400,104" fill="none" stroke="#e0a44e"
            stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="104" r="26" fill="#e0a44e"/>
</svg>
